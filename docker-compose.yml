services:
  postgres:
    image: postgres:16-alpine
    container_name: sessiongrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-sessiongrid}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-sessiongrid}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-sessiongrid} -d ${DB_NAME:-sessiongrid}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
